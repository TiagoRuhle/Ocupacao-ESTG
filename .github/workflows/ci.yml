name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Os testes de test_load.py e test_queries.py precisam de MySQL e ficam de fora.
      - name: Testes (sem base de dados)
        run: >
          pytest tests/test_extract.py tests/test_transform.py tests/test_transforms.py
          tests/test_plots.py tests/test_auth.py tests/test_utils_formato.py -q